[project]
name = "agentic-soccer"
version = "0.1.0"
description = "Agentic soccer: LLM coach/player agents driving a soccer simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gfootball==2.10.2",
    "pygame>=2.6",
    "anthropic>=0.40",
    "fastmcp>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "black>=24.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator", "mcp_server", "agents", "replay"]

# ---------------------------------------------------------------------------
# gfootball (Google Research Football) build configuration.
#
# gfootball 2.10.2 ships only an sdist and compiles a C++ engine at install
# time. Three things break a plain `uv sync` on macOS arm64 / Python 3.12:
#
#   1. setup.py imports `psutil` / `numpy` / `cmake` (the PyPI cmake wheel)
#      to drive the build, but uv's default build isolation hides them ->
#      "ModuleNotFoundError: No module named 'psutil'" (then 'cmake'). We
#      inject them into the isolated build env via extra-build-dependencies.
#   2. The C++ engine links against Homebrew SDL2 / boost / glew. We point
#      the compiler/linker at the Homebrew prefix via extra-build-variables
#      so the build does not depend on the caller's shell environment.
#      (Apple Silicon brew prefix = /opt/homebrew; see README for prereqs:
#       brew install cmake sdl2 sdl2_image sdl2_ttf sdl2_gfx boost glew.)
#   3. Both uv options are preview features. uv prints a cosmetic
#      "experimental" warning for them; pass
#      `--preview-features extra-build-dependencies,extra-build-variables`
#      to silence it. The options are applied regardless of the warning.
# ---------------------------------------------------------------------------
[tool.uv.extra-build-dependencies]
gfootball = ["psutil", "numpy", "setuptools", "wheel", "cmake"]

[tool.uv.extra-build-variables]
# CMAKE_POLICY_VERSION_MINIMUM=3.5: gfootball's engine CMakeLists.txt declares
# cmake_minimum_required(VERSION 3.4); CMake 4.x removed compat below 3.5 and
# hard-errors without this. The C++ engine also REQUIRES the SDL2 satellite
# libs (sdl2_image, sdl2_ttf, sdl2_gfx) in addition to base sdl2 — install all:
#   brew install cmake sdl2 sdl2_image sdl2_ttf sdl2_gfx boost glew
gfootball = { CMAKE_PREFIX_PATH = "/opt/homebrew", CPATH = "/opt/homebrew/include", LIBRARY_PATH = "/opt/homebrew/lib", CMAKE_POLICY_VERSION_MINIMUM = "3.5" }

# Lint/type config lives in standalone ruff.toml and mypy.ini (the single
# source of truth). Test config stays here so pytest picks it up automatically.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
