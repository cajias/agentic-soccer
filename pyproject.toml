[project]
name = "agentic-soccer"
version = "0.1.0"
description = "Agentic soccer: LLM coach/player agents driving a soccer simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gfootball==2.10.2",
    "pygame>=2.6",
    "anthropic>=0.40",
    "fastmcp>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "black>=24.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator", "mcp_server", "agents", "replay"]

# ---------------------------------------------------------------------------
# gfootball (Google Research Football) build configuration.
#
# gfootball 2.10.2 ships only an sdist and compiles a C++ engine at install
# time. Two things break a plain `uv sync` on macOS arm64 / Python 3.12:
#
#   1. setup.py imports `psutil`/`numpy` to drive the build, but uv's default
#      build isolation hides them -> "ModuleNotFoundError: No module named
#      'psutil'". We inject them into the isolated build env below.
#   2. The C++ engine links against Homebrew SDL2/boost/glew. CMake finds them
#      automatically under /opt/homebrew on Apple Silicon, so no extra flags
#      are required as long as the brew packages are installed (see README).
#
# `extra-build-dependencies` is a uv preview feature; enabling it here keeps
# `uv sync` working without the --preview-features flag or a warning.
# ---------------------------------------------------------------------------
[tool.uv]
preview-features = ["extra-build-dependencies"]

[tool.uv.extra-build-dependencies]
gfootball = ["psutil", "numpy", "setuptools", "wheel"]

# ---------------------------------------------------------------------------
# Lint configuration copied from github.com/cajias/lint-configs (python/),
# adapted: target-version py312, known-first-party + coverage source set to
# this project's packages, and pygame/gfootball added to mypy import overrides.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes (includes unused imports F401, unused variables F841)
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear (common bugs)
    "W",     # pycodestyle warnings
    "C90",   # McCabe complexity
    "SIM",   # flake8-simplify (detect overly complex code)
    "PIE",   # flake8-pie
    "PLR",   # Pylint refactoring
    "RET",   # flake8-return
    "ANN",   # flake8-annotations (require type hints)
    "UP",    # pyupgrade
    "D",     # pydocstyle (docstring conventions)
    "N",     # pep8-naming
    "S",     # flake8-bandit (security issues)
    "BLE",   # flake8-blind-except
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (dead code detection)
    "PGH",   # pygrep-hooks
    "PL",    # Pylint
    "TRY",   # tryceratops
    "FLY",   # flynt
    "PERF",  # Perflint
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E203",  # Whitespace before ':' (conflicts with Black)
    "E501",  # Line too long (handled by Black)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN001", "ANN201", "PLR2004", "PLR0913"]
"**/test_*.py" = ["S101", "ANN001", "ANN201", "PLR2004", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["simulator", "mcp_server", "agents", "replay"]
force-single-line = false
lines-after-imports = 2

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
strict = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = ["mcp.*", "fastmcp.*", "pydantic.*", "pygame.*", "gfootball.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["simulator", "mcp_server", "agents", "replay"]
omit = ["*/tests/*", "*/test_*.py", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
