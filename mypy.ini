; mypy configuration copied from github.com/cajias/lint-configs (python/
; pyproject-linters.toml [tool.mypy]), adapted: python_version 3.9 -> 3.12, and
; pygame/gfootball/fastmcp/numpy added to the missing-imports override.
; Standalone file so it does not collide with pyproject.toml's [tool.uv] block.

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
strict = True
show_error_codes = True
show_column_numbers = True
pretty = True

[mypy-mcp.*]
ignore_missing_imports = True

[mypy-fastmcp.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-pygame.*]
ignore_missing_imports = True

[mypy-gfootball.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True
